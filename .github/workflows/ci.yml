name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint e formatação
        run: npm run lint

      - name: Tipagem
        run: npx tsc --noEmit && npx tsc -p tsconfig.e2e.json --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # separado do resto porque baixa um navegador inteiro e demora bem mais.
  # assim da pra ver de longe se o que quebrou foi a tela ou o nucleo
  navegador:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Testes de tela
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
